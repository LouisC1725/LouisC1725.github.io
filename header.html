<style>
    .skill-grid::after {
        content: none !important;
        display: none !important;
    }

    .certified-skills-label {
        margin: 22px 0 12px;
        color: var(--orange-dark);
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-align: center;
        text-transform: uppercase;
    }

    .certified-skill-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 14px;
    }

    .certified-skill-grid .skill-pill {
        color: #5a2f12;
        border-color: rgba(255, 104, 26, 0.34);
        background: rgba(255, 197, 145, 0.68);
        box-shadow: 0 10px 24px rgba(255, 104, 26, 0.12);
    }

    @media (max-width: 991px) {
        .certified-skill-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
    }

    @media (max-width: 640px) {
        .certified-skill-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .certified-skills-label {
            font-size: 0.82rem;
            letter-spacing: 0.12em;
        }
    }
</style>

<script>
    (function () {
        var skillsGrid = document.querySelector('.skill-grid');

        if (!skillsGrid || document.querySelector('.certified-skill-grid')) {
            return;
        }

        var certifiedLabel = document.createElement('p');
        certifiedLabel.className = 'certified-skills-label';
        certifiedLabel.textContent = 'Certified Skills';

        var certifiedGrid = document.createElement('div');
        certifiedGrid.className = 'certified-skill-grid';
        certifiedGrid.setAttribute('aria-label', 'Certified skills');

        ['Altium', 'Autodesk Inventor', 'Excel', 'PowerPoint', 'Word'].forEach(function (skill) {
            var pill = document.createElement('div');
            pill.className = 'skill-pill certified-skill-pill';
            pill.textContent = skill;
            certifiedGrid.appendChild(pill);
        });

        skillsGrid.insertAdjacentElement('afterend', certifiedGrid);
        skillsGrid.insertAdjacentElement('afterend', certifiedLabel);
    }());
</script>
